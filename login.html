<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Flor & Renda</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="pagina-login">

    <div class="login-container">

        <!-- LADO DA MARCA -->
        <section class="login-apresentacao">

            <div class="login-logo">
                <img src="logo.jpeg" alt="Logo Flor & Renda">
            </div>

            <h1>Flor & Renda</h1>

            <p>
                Vista seus momentos com delicadeza,
                estilo e elegância.
            </p>

        </section>


        <!-- LADO DO LOGIN -->
        <section class="login-caixa">

            <h2>Bem-vindo!</h2>

            <p class="login-subtitulo">
                Entre na sua conta para continuar.
            </p>

            <form id="formLogin">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit" class="botao-login-principal">
                    Entrar
                </button>

            </form>

            <p class="login-cadastro">
                Ainda não tem uma conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

        </section>

    </div>


    <script src="login.js"></script>

</body>

</html>
