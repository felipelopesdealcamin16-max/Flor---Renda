================================== -->

================================== -->

<main class="pagina-farm">


    <!-- =================================
         TOPO DA LOJA
    ================================== -->

    <div class="topo-farm">

        <div class="logo-farm">

            >

                Vestido Floral
            </h3>


            <p class="marca-produto">
                FARM
            </p>


            <p class="preco-farm">
                R$ 249,90
            </p>


            <label for="farm-tamanho1">
                Tamanho:
            </label>

                id="farm-tamanho1"
                class="tamanho-farm"
            >

                    Selecione

                <option value="PP">
                    PP
                </option>

                <option value="P">
                    P
                </option>

                <option value="M">
                    M
                </option>

                <option value="G">
                    G
                </option>

                <option value="GG">
                    GG
                </option>

            </select>


            <button
                class="botao-farm"
                type="button"
                onclick="adicionarCarrinho('Vestido Floral FARM', 249.90)"

                Adicionar ao carrinho
